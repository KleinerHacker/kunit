kotlin.code.style=official

# Every host can only run the test tasks of its own native targets (a Linux runner cannot run the macOS or
# iOS tests). Without this, Gradle emits a warning per unrunnable target on every single build.
kotlin.native.ignoreDisabledTargets=true
