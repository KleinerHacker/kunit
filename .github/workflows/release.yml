name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  # Fail fast: make sure the tag has a matching changelog entry before anything
  # else runs, so a missing entry does not surface late in the release flow.
  verify-changelog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Verify changelog entry exists
        run: |
          TAG="${{ github.ref_name }}"
          NOTES=$(awk "/^## \[$TAG\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          NOTES=$(echo "$NOTES" | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba}')
          if [ -z "$NOTES" ]; then
            echo "ERROR: No changelog entry found for tag $TAG"
            exit 1
          fi
          echo "Changelog entry for tag $TAG found."

  licences:
    runs-on: ubuntu-latest
    needs: verify-changelog

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check licences
        run: ./gradlew licensee --stacktrace

  # Build and test in parallel on all three host families. A host can only run the tests of its own native
  # targets, so this is what actually exercises the macOS/iOS and Windows artifacts.
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: verify-changelog
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

  # Build the docs as a generation test (mkdocs --strict) before they get deployed.
  validate-docs:
    runs-on: ubuntu-latest
    needs: verify-changelog
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Pip Update
        run: pip install --upgrade pip

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build docs
        run: ./gradlew buildDocs --stacktrace --info

  # Publish the docs to gh-pages (mkdocs gh-deploy --force, see the deployDocs task).
  deploy-docs:
    runs-on: ubuntu-latest
    needs: validate-docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Pip Update
        run: pip install --upgrade pip

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Configure git for gh-deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy docs
        run: ./gradlew deployDocs -PdocsVersion="${{ github.ref_name }}" --stacktrace --info

      - name: Set default docs version
        run: ./gradlew setDefaultDocs --stacktrace --info

  # Publish every artifact from ONE host. Kotlin/Native cross-compiles the Apple and Windows klibs since
  # 2.2.20, and GitHub Packages rejects re-publishing a version - so a per-host matrix deploy would fail on
  # the second runner.
  publish:
    runs-on: ubuntu-latest
    needs:
      - build
      - licences

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          ./gradlew publishAllPublicationsToGitHubPackagesRepository
          -PreleaseVersion="${{ github.ref_name }}"
          --stacktrace

  release:
    runs-on: ubuntu-latest
    needs:
      - publish
      - deploy-docs

    steps:
      - uses: actions/checkout@v7

      - name: Extract changelog
        run: |
          TAG="${{ github.ref_name }}"
          NOTES=$(awk "/^## \[$TAG\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          NOTES=$(echo "$NOTES" | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba}')
          if [ -z "$NOTES" ]; then
            echo "ERROR: No changelog entry found for tag $TAG"
            exit 1
          fi
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ ^(0|[a-zA-Z]) ]]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "$RELEASE_NOTES" \
              --prerelease \
              --latest=false
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "$RELEASE_NOTES" \
              --latest
          fi
